<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=6, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>도면 보기 — 이야기상자와 서랍장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --paper:#F1EFE9; --surface:#FAF9F6; --surface-2:#E9E6DE;
    --ink:#211F1B; --ink-2:#6B665C;
    --rule:#D5D0C5; --rule-strong:#B9B2A3;
    --accent:#1B6E68; --accent-soft:#DCEAE7; --warn:#A24B1C; --warn-soft:#F6E7DC;
    --sans:"Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141613; --surface:#1C1F1B; --surface-2:#252923;
      --ink:#E9E5DB; --ink-2:#9C978B;
      --rule:#31352D; --rule-strong:#454A40;
      --accent:#5CC2B6; --accent-soft:#1B3A36; --warn:#E09159; --warn-soft:#3A2717;
    }
  }
  :root[data-theme="dark"]{
    --paper:#141613; --surface:#1C1F1B; --surface-2:#252923;
    --ink:#E9E5DB; --ink-2:#9C978B;
    --rule:#31352D; --rule-strong:#454A40;
    --accent:#5CC2B6; --accent-soft:#1B3A36; --warn:#E09159; --warn-soft:#3A2717;
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; -webkit-font-smoothing:antialiased}

  header{position:sticky; top:0; z-index:10; background:var(--surface);
    border-bottom:1px solid var(--rule); padding:10px 14px 11px;
    padding-inline:max(14px, env(safe-area-inset-left,0px));
    box-shadow:0 1px 10px rgba(0,0,0,.05)}
  .bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .back{display:inline-flex; align-items:center; gap:7px; flex:0 0 auto;
    background:var(--accent); color:#fff; text-decoration:none;
    font-weight:700; font-size:15px; border:0; cursor:pointer;
    border-radius:9px; padding:11px 16px; line-height:1}
  .back:active{filter:brightness(.92)}
  .ttl{font-weight:700; font-size:15px; flex:1 1 auto;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tabs{display:flex; gap:7px; overflow-x:auto; margin-top:9px;
    padding-bottom:2px; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; border:1px solid var(--rule-strong); background:var(--surface-2);
    color:var(--ink-2); font:inherit; font-size:13px; font-weight:700;
    border-radius:8px; padding:9px 13px; cursor:pointer; white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--accent-soft); color:var(--accent);
    border-color:var(--accent)}

  /* 두께 조절 */
  .tk{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px;
    padding-top:10px; border-top:1px solid var(--rule)}
  .tk .lb{font-weight:700; font-size:13px}
  .tk input[type=range]{flex:1 1 150px; min-width:120px; accent-color:var(--accent)}
  .tk .val{font-weight:700; color:var(--accent); min-width:56px; text-align:right;
    font-variant-numeric:tabular-nums}
  .tk .ps{display:flex; gap:6px}
  .tk .ps button{border:1px solid var(--rule-strong); background:var(--surface-2);
    color:var(--ink-2); font:inherit; font-size:12px; font-weight:700;
    border-radius:7px; padding:7px 10px; cursor:pointer}
  .tk .ps button.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}

  main{padding:14px; padding-inline:max(14px, env(safe-area-inset-left,0px))}
  .note{margin:0 2px 10px; font-size:12.5px; color:var(--ink-2); line-height:1.6}
  .note b{color:var(--warn)}
  .stage{position:relative; background:#fff; border:1px solid var(--rule);
    border-radius:12px; overflow:auto; -webkit-overflow-scrolling:touch}
  .inner{position:relative; width:100%; margin:0 auto}
  .stage.zoom .inner{width:auto}
  .inner img{display:block; width:100%; height:auto; touch-action:pinch-zoom}
  .stage.zoom .inner img{width:auto; max-width:none}
  .inner svg{position:absolute; left:0; top:0; width:100%; height:100%;
    pointer-events:none}
  .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin:12px 2px 30px; color:var(--ink-2); font-size:13px}
  .btn{border:1px solid var(--rule-strong); background:var(--surface);
    color:var(--ink); font:inherit; font-size:13px; font-weight:700;
    border-radius:8px; padding:9px 13px; cursor:pointer; text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="back" href="./">◂ 3D 화면으로</a>
    <span class="ttl" id="ttl">도면</span>

  <div class="tk">
    <span class="lb">판 두께</span>

    <span class="val" id="tkv">15mm</span>
    <span class="ps" id="tkp"></span>
  </div>
</header>

<main>
  <p class="note" id="note"></p>
  <div class="stage" id="stage">
    <div class="inner" id="inner">
      <img id="img" alt="도면">
      <svg id="ov" preserveAspectRatio="none"></svg>
    </div>
  </div>
  <div class="row">
    <button class="btn" id="zoom" type="button">원본 크기로 보기</button>
    <a class="btn" id="raw" href="#" target="_blank" rel="noopener">새 탭에서 그림만 열기</a>
    <span id="hint"></span>
  </div>
</main>

var BASE = 15;                       /* 그림을 그린 두께 */
var img=document.getElementById("img"), stage=document.getElementById("stage"),
    inner=document.getElementById("inner"), ov=document.getElementById("ov"),
    tabs=document.getElementById("tabs"), tkR=document.getElementById("tk"),
    cur=null, T=15;

function mm(v, dec){
  var p = Math.pow(10, dec==null?1:dec);
  return String(Math.round(v*p)/p);
}
function el(n){ return document.createElementNS("http://www.w3.org/2000/svg", n); }

/* 그림 위 숫자를 지금 두께로 다시 쓴다.
   그림(선)은 15mm 로 그린 것 그대로이고, 숫자만 바뀐다 */
function paint(){
  var D = DIM_DATA[cur.k];
  ov.innerHTML = "";
  if(!D) return;
  ov.setAttribute("viewBox", "0 0 " + D.w + " " + D.h);
  var moved = Math.abs(T - BASE) > 1e-9;
  var pend = [];

  (D.nums||[]).forEach(function(n){
    var live = Math.abs(n.b) > 1e-9;
    var g = el("g"), r = el("rect"), t = el("text");
    t.textContent = mm(n.a + n.b*T);
    t.setAttribute("x", n.x); t.setAttribute("y", n.y);
    t.setAttribute("text-anchor", "middle");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("font-size", n.fs);
    t.setAttribute("font-weight", "700");
    t.setAttribute("fill", (moved && live) ? "#A2451B" : "#146862");
    if(n.r) t.setAttribute("transform", "rotate("+n.r+" "+n.x+" "+n.y+")");
    g.appendChild(r); g.appendChild(t); ov.appendChild(g);
    pend.push([r, t, n, !!n.r]);
  });

  (D.texts||[]).forEach(function(q){
    var s = q.tpl.replace("{T}", mm(T));
    (q.v||[]).forEach(function(ab, i){
      s = s.replace("{"+i+"}", mm(ab[0] + ab[1]*T, q.dec));
    });
    var g = el("g"), r = el("rect"), t = el("text");
    t.textContent = s;
    t.setAttribute("x", q.x); t.setAttribute("y", q.y);
    t.setAttribute("text-anchor", q.an || "start");
    t.setAttribute("dominant-baseline", "central");
    t.setAttribute("font-size", q.fs);
    t.setAttribute("fill", q.col === "ink2" ? "#6C665C" : "#1A1814");
    g.appendChild(r); g.appendChild(t); ov.appendChild(g);
    r.setAttribute("x", q.x - 3); r.setAttribute("y", q.y - q.bh/2);
    r.setAttribute("width", q.bw); r.setAttribute("height", q.bh);
    r.setAttribute("fill", q.bg || "#FFFFFE");
  });

  /* 글자를 실제로 재서 바탕 네모를 덮는다 (원래 숫자가 비쳐 보이면 안 된다) */
  pend.forEach(function(p){
    var r = p[0], t = p[1], n = p[2], rot = p[3];
    var bb;
    try { bb = t.getBBox(); } catch(e) { bb = {width:n.bw, height:n.bh}; }
    var w = rot ? bb.height + 6 : bb.width + 10;
    var h = rot ? bb.width + 10 : bb.height + 6;
    w = Math.max(w, n.bw); h = Math.max(h, n.bh);
    r.setAttribute("x", n.x - w/2); r.setAttribute("y", n.y - h/2);
    r.setAttribute("width", w); r.setAttribute("height", h);
    r.setAttribute("fill", "#FFFFFE");
  });

  document.getElementById("note").innerHTML = moved
    ? "그림의 <b>선</b>은 15mm 로 그린 그대로이고, <b>숫자만</b> " + mm(T) +
      "mm 에 맞춰 다시 적었습니다. 주황색이 두께 때문에 바뀐 숫자입니다. " +
      "내려받는 그림 파일은 15mm 고정입니다."
    : "치수는 mm. 위에서 판 두께를 바꾸면 도면의 숫자가 따라 바뀝니다 (그림의 선은 15mm 기준 그대로).";
}

function show(k, push){
  var s = null;
  for (var i=0;i<SHEETS.length;i++) if (SHEETS[i].k === k) s = SHEETS[i];
  if (!s) s = SHEETS[0];
  cur = s;
  img.src = s.f; img.alt = s.t;
  document.getElementById("ttl").textContent = s.t;
  document.getElementById("raw").href = s.f;
  document.title = s.t + " — 도면";
  stage.classList.remove("zoom");
  document.getElementById("zoom").textContent = "원본 크기로 보기";
  var bs = tabs.children;
  for (var j=0;j<bs.length;j++)
    bs[j].setAttribute("aria-selected", bs[j].dataset.k === s.k ? "true" : "false");
  if (push) history.replaceState(null, "", "?p=" + s.k + "&t=" + mm(T));
  stage.scrollTop = 0; stage.scrollLeft = 0;
  paint();
}

function setT(v, quiet){
  v = Math.max(9, Math.min(25, Math.round(v*2)/2));
  T = v;
  tkR.value = v;
  document.getElementById("tkv").textContent = mm(v) + "mm";
  [].forEach.call(document.querySelectorAll("#tkp button"), function(b){
    b.classList.toggle("on", parseFloat(b.dataset.t) === T);
  });
  if(!quiet){
    try{ localStorage.setItem("mokgongT", String(T)); }catch(e){}
    history.replaceState(null, "", "?p=" + cur.k + "&t=" + mm(T));
  }
  paint();
}

SHEETS.forEach(function(s){
  var b = document.createElement("button");
  b.className = "tab"; b.type = "button"; b.dataset.k = s.k; b.textContent = s.tab;
  b.onclick = function(){ show(s.k, true); };
  tabs.appendChild(b);
});
[12,15,18,24].forEach(function(t){
  var b = document.createElement("button");
  b.type = "button"; b.dataset.t = t; b.textContent = t;
  b.onclick = function(){ setT(t); };
  document.getElementById("tkp").appendChild(b);
});
tkR.oninput = function(){ setT(parseFloat(this.value)); };

document.getElementById("zoom").onclick = function(){
  var on = stage.classList.toggle("zoom");
  this.textContent = on ? "화면 폭에 맞추기" : "원본 크기로 보기";
  if (on) stage.scrollLeft = (inner.scrollWidth - stage.clientWidth) / 2;
};
img.onload = function(){
  inner.style.maxWidth = img.naturalWidth + "px";
  document.getElementById("hint").textContent =
    "원본 " + img.naturalWidth + " × " + img.naturalHeight + " · 손가락 두 개로 확대됩니다";
  paint();
};

(function(){
  var q = new URLSearchParams(location.search);
  var t = parseFloat(q.get("t"));
  if(!(t > 0)){ try{ t = parseFloat(localStorage.getItem("mokgongT")); }catch(e){} }
  cur = SHEETS[0];
  setT(t > 0 ? t : 15, true);
  show((q.get("p") || "a1").toLowerCase(), false);
})();
</script>
