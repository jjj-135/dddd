<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="집성목 15mm로 만드는 닭 이야기상자와 서랍 2칸 수납장의 3D 도면과 재단 목록.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="이야기상자와 서랍장">
<meta property="og:description" content="집성목 15T 제작도면 · 3D로 돌려보고 부재 치수를 확인할 수 있습니다.">
<style>
  html{color-scheme:light dark}
  body{margin:0;font:14px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif;background:#faf9f7}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>이야기상자와 서랍장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --paper:#F1EFE9; --surface:#FAF9F6; --surface-2:#E9E6DE;
    --ink:#211F1B; --ink-2:#6B665C; --ink-3:#8F8A7E;
    --rule:#D5D0C5; --rule-strong:#B9B2A3;
    --accent:#1B6E68; --accent-soft:#DCEAE7; --accent-ink:#0E4E49;
    --warn:#A24B1C; --warn-soft:#F3E3D6;
    --wood:#DFB983; --wood-dark:#A97C43;
    --shadow:0 1px 2px rgba(33,31,27,.06), 0 8px 24px -12px rgba(33,31,27,.18);
    --sans:"Noto Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "Consolas", monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141613; --surface:#1C1F1B; --surface-2:#252923;
      --ink:#E9E5DB; --ink-2:#9C978B; --ink-3:#7A756A;
      --rule:#31352D; --rule-strong:#454A40;
      --accent:#5CC2B6; --accent-soft:#1B3A36; --accent-ink:#8FDCD2;
      --warn:#E09159; --warn-soft:#3A2717;
      --wood:#D2AC77; --wood-dark:#8A6132;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141613; --surface:#1C1F1B; --surface-2:#252923;
    --ink:#E9E5DB; --ink-2:#9C978B; --ink-3:#7A756A;
    --rule:#31352D; --rule-strong:#454A40;
    --accent:#5CC2B6; --accent-soft:#1B3A36; --accent-ink:#8FDCD2;
    --warn:#E09159; --warn-soft:#3A2717;
    --wood:#D2AC77; --wood-dark:#8A6132;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1500px; margin:0 auto; padding-inline:16px; padding-block:20px 48px}

  .mast{display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 28px;
    padding-bottom:14px; border-bottom:2px solid var(--ink)}
  .mast h1{font-size:clamp(22px,3.4vw,32px); font-weight:900; letter-spacing:-.02em;
    margin:0; text-wrap:balance}
  .mast .sub{margin:2px 0 0; color:var(--ink-2); font-size:13.5px}
  .spec{margin-left:auto; display:flex; gap:0; border:1px solid var(--rule-strong);
    border-radius:3px; overflow:hidden; background:var(--surface)}
  .spec div{padding:6px 12px; border-right:1px solid var(--rule)}
  .spec div:last-child{border-right:0}
  .spec b{display:block; font-family:var(--mono); font-size:14px; font-weight:600}
  .spec span{display:block; font-size:10.5px; color:var(--ink-3); letter-spacing:.09em}

  .tabs{display:flex; gap:8px; margin:18px 0 0; flex-wrap:wrap}
  .tab{font-family:var(--sans); font-size:14px; font-weight:700; color:var(--ink-2);
    background:var(--surface); border:1px solid var(--rule-strong);
    border-radius:3px; padding:9px 16px; cursor:pointer; display:flex; gap:9px; align-items:center}
  .tab .k{font-family:var(--mono); font-size:11px; font-weight:600;
    background:var(--surface-2); color:var(--ink-3); padding:1px 6px; border-radius:2px}
  .tab[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
  .tab[aria-selected="true"] .k{background:rgba(255,255,255,.22); color:#fff}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .stage{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr); gap:20px; margin-top:16px}
  @media (max-width:900px){ .stage{grid-template-columns:1fr} }

  .viewer{position:relative; background:var(--surface); border:1px solid var(--rule-strong);
    border-radius:4px; overflow:hidden; box-shadow:var(--shadow);
    aspect-ratio:4/3; max-width:100%}
  @media (max-width:900px){ .viewer{aspect-ratio:1/1} }
  #cv{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
  #cv:active{cursor:grabbing}

  .hint{position:absolute; left:12px; bottom:12px; font-size:11.5px; color:var(--ink-3);
    background:var(--surface); border:1px solid var(--rule); border-radius:3px;
    padding:4px 9px; pointer-events:none; opacity:.92}
  .lbl{position:absolute; transform:translate(-50%,-50%); pointer-events:none;
    font-family:var(--mono); font-size:11.5px; font-weight:600; color:#fff;
    background:var(--accent); padding:1.5px 6px; border-radius:2px; white-space:nowrap;
    box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .readout{position:absolute; left:12px; top:12px; max-width:64%;
    background:var(--surface); border:1px solid var(--rule-strong);
    border-left:3px solid var(--accent); border-radius:3px; padding:8px 12px;
    pointer-events:none; opacity:.96}
  .readout .nm{font-weight:700; font-size:13.5px}
  .readout .dm{font-family:var(--mono); font-size:12.5px; color:var(--ink-2); margin-top:1px}
  .readout .nt{font-size:11.5px; color:var(--warn); margin-top:3px}

  .ctl{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; margin-top:12px;
    padding:11px 14px; background:var(--surface); border:1px solid var(--rule); border-radius:4px}
  .ctl label{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); font-weight:500}
  .ctl input[type=range]{width:150px; accent-color:var(--accent)}
  .ctl input[type=checkbox]{width:15px; height:15px; accent-color:var(--accent)}
  .btn{font:inherit; font-size:12.5px; font-weight:700; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--rule-strong);
    border-radius:3px; padding:5px 11px; cursor:pointer}
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .grps{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px}
  .grp{display:flex; align-items:center; gap:7px; font:inherit; font-size:12.5px; font-weight:700;
    color:var(--ink-2); background:var(--surface); border:1px solid var(--rule-strong);
    border-radius:99px; padding:4px 12px 4px 8px; cursor:pointer}
  .grp i{width:9px; height:9px; border-radius:50%; background:currentColor; opacity:.55; font-style:normal}
  .grp b{font-family:var(--mono); font-weight:600; color:var(--ink-3); font-size:11px}
  .grp:hover, .grp.on{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .grp:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  .side{display:flex; flex-direction:column; gap:16px; min-width:0}
  .card{background:var(--surface); border:1px solid var(--rule-strong); border-radius:4px; overflow:hidden}
  .card > h2{margin:0; font-size:11.5px; font-weight:700; letter-spacing:.11em; color:var(--ink-2);
    padding:9px 14px; background:var(--surface-2); border-bottom:1px solid var(--rule)}
  .card .bd{padding:12px 14px}

  .dims{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--rule)}
  .dims div{background:var(--surface); padding:11px 12px}
  .dims b{display:block; font-family:var(--mono); font-size:19px; font-weight:600; letter-spacing:-.02em}
  .dims span{display:block; font-size:10.5px; color:var(--ink-3); letter-spacing:.09em; margin-top:1px}

  table{width:100%; border-collapse:collapse; font-size:12.5px}
  .tw{overflow-x:auto}
  th{text-align:left; font-size:10.5px; letter-spacing:.08em; color:var(--ink-3); font-weight:700;
    padding:7px 10px; border-bottom:1px solid var(--rule-strong); white-space:nowrap}
  td{padding:7px 10px; border-bottom:1px solid var(--rule); vertical-align:top}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr.on{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
  td.n{font-family:var(--mono); white-space:nowrap; font-variant-numeric:tabular-nums}
  td.q{font-family:var(--mono); text-align:right; white-space:nowrap}
  .chg{color:var(--warn); font-size:11px; display:block}
  .sub2{color:var(--ink-3); font-size:11px; display:block}

  .note{font-size:12.5px; color:var(--ink-2); margin:0 0 9px}
  .note:last-child{margin-bottom:0}
  .note b{color:var(--ink)}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums}
  ul.fix{margin:0; padding-left:17px; font-size:12.5px; color:var(--ink-2)}
  ul.fix li{margin-bottom:7px}
  ul.fix li:last-child{margin-bottom:0}
  ul.fix b{color:var(--ink)}
  .tag{display:inline-block; font-family:var(--mono); font-size:10.5px; font-weight:600;
    background:var(--warn-soft); color:var(--warn); padding:1px 5px; border-radius:2px; margin-right:5px}
  .tag.ok{background:var(--accent-soft); color:var(--accent-ink)}
  footer{margin-top:28px; padding-top:12px; border-top:1px solid var(--rule);
    font-size:11.5px; color:var(--ink-3); display:flex; flex-wrap:wrap; gap:6px 18px}

  /* 확대·축소 단추 — 폰에서 손가락으로 누르기 좋게 */
  .zoom{position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:7px}
  .zb{width:42px; height:42px; font:inherit; font-size:20px; font-weight:700; line-height:1;
    color:var(--ink); background:var(--surface); border:1px solid var(--rule-strong);
    border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:var(--shadow); -webkit-tap-highlight-color:transparent; padding:0}
  .zb:active{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
  .zb:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  @media (max-width:640px){
    body{font-size:14px}
    .wrap{padding-block:14px 32px}
    .mast{gap:10px}
    .spec{margin-left:0; width:100%}
    .spec div{flex:1; padding:6px 8px}
    .viewer{aspect-ratio:3/4}
    .tab{flex:1 1 auto; justify-content:center; padding:11px 12px}
    .ctl{gap:12px 14px; padding:12px}
    .ctl label:first-child{flex:1 1 100%}
    .ctl input[type=range]{flex:1; width:auto; height:26px}
    .ctl input[type=checkbox]{width:19px; height:19px}
    .btn{padding:10px 14px; font-size:13px}
    .grp{padding:8px 14px 8px 10px; font-size:13px}
    .readout{max-width:74%; padding:6px 9px}
    .readout .nm{font-size:12.5px}
    .readout .dm{font-size:11px}
    .hint{display:none}
    .lbl{font-size:11px}
  }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>


<div class="wrap">
  <div class="mast">
    <div>
      <h1>이야기상자와 서랍장</h1>
      <p class="sub">집성목 15T 제작도면 · 원본 손도면의 치수를 맞물리게 고친 판</p>
    </div>
    <div class="spec">
      <div><b>15mm</b><span>집성목 두께</span></div>
      <div><b>2440×1220</b><span>원판 1장</span></div>
      <div><b id="usePct">–</b><span>원판 사용률</span></div>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-A" aria-selected="true"><span class="k">A</span>서랍 2칸 수납장</button>
    <button class="tab" role="tab" id="tab-B" aria-selected="false"><span class="k">B</span>닭 이야기상자</button>
  </div>

  <div class="stage">
    <div>
      <div class="viewer">
        <canvas id="cv"></canvas>
        <div class="readout" id="ro">
          <div class="nm">부재를 누르면 치수가 나옵니다</div>
          <div class="dm">한 손가락 돌리기 · 두 손가락 확대·이동</div>
        </div>
        <div class="zoom">
          <button class="zb" id="zin"  type="button" aria-label="확대">+</button>
          <button class="zb" id="zout" type="button" aria-label="축소">–</button>
          <button class="zb" id="zfit" type="button" aria-label="화면에 맞추기">⤢</button>
        </div>
        <div class="hint">단위 mm · 초록 치수선은 완성 바깥치수</div>
      </div>
      <div class="ctl">
        <label>분해 <input type="range" id="ex" min="0" max="100" value="0"></label>
        <label><input type="checkbox" id="cut"> 앞판 벗기기</label>
        <label><input type="checkbox" id="dim" checked> 치수선</label>
        <button class="btn" id="reset">시점 되돌리기</button>
        <button class="btn" id="spin">자동 회전</button>
      </div>
      <div class="grps" id="grps"></div>
    </div>

    <div class="side">
      <div class="card">
        <h2>완성 바깥치수</h2>
        <div class="dims" id="dims"></div>
      </div>
      <div class="card">
        <h2 id="cutTitle">재단 목록</h2>
        <div class="tw">
          <table>
            <thead><tr><th>번호</th><th>부재</th><th>가로 × 세로 × 두께</th><th>수량</th></tr></thead>
            <tbody id="tb"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <h2>원본에서 고친 것</h2>
        <div class="bd"><ul class="fix" id="fixes"></ul></div>
      </div>
      <div class="card">
        <h2>공방에 확인할 것</h2>
        <div class="bd" id="asks"></div>
      </div>
    </div>
  </div>

  <footer>
    <span>단위 mm · 판 두께 15T 기준</span>
    <span>치수는 손도면 기준, 배치는 레퍼런스 도면을 따름</span>
    <span id="stamp"></span>
  <span><a href="도면_A_서랍수납장.png" style="color:var(--accent);font-weight:700">▸ 도면 A 보기 (PNG)</a></span><span><a href="도면_B_닭이야기상자.png" style="color:var(--accent);font-weight:700">▸ 도면 B 보기 (PNG)</a></span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var T = 15;              // 집성목 두께
var BEV = 1.1;           // 모서리 둥글리기

/* 색: 나무 외에 칠하는 조각들 */
var COL = { comb:0xC0442F, beak:0xE3A33C, eye:0x2E2722,
            note1:0xF0A0B8, note2:0xF3DB80, note3:0xA6C8E8,
            pen1:0x2F4A7A, pen2:0x8C3A34, pen3:0x33302C };

/* ===================================================================
   부재 정의. 여기 숫자만 고치면 3D·표·치수가 같이 바뀝니다.
   좌표: x=좌우(0이 본체 왼쪽), y=높이(0이 바닥), z=앞뒤(0이 뒤)
   g = 분해할 때 묶이는 덩어리
   =================================================================== */

function modelA(){
  var W=300, H=225, D=130, CD=100;
  var OW=270, OH=90, oy1=15, oy2=120;
  var dw=266, dh=86, dd=95;
  var P=[]; function p(o){ P.push(o); return o; }

  p({id:1, g:"프레임", n:"천판",   cut:"300 × 100", q:1, x:0,   y:H-T, z:T, w:W, h:T, d:CD});
  p({id:2, g:"프레임", n:"바닥판", cut:"300 × 100", q:1, x:0,   y:0,   z:T, w:W, h:T, d:CD});
  p({id:3, g:"프레임", n:"옆판",   cut:"100 × 195", q:2, x:0,   y:T,   z:T, w:T, h:H-2*T, d:CD, chg:"높이 200 → 195"});
  p({id:3, g:"프레임", n:"옆판",   cut:"100 × 195", q:0, x:W-T, y:T,   z:T, w:T, h:H-2*T, d:CD});
  p({id:4, g:"프레임", n:"중간판", cut:"270 × 100", q:1, x:T,   y:105, z:T, w:OW, h:T, d:CD, chg:"깊이 70 → 100"});
  p({id:5, g:"프레임", n:"뒷판",   cut:"300 × 225", q:1, x:0,   y:0,   z:0, w:W, h:H, d:T, chg:"세로 200 → 225"});
  p({id:6, g:"프레임", n:"앞판",   cut:"300 × 225", q:1, x:0,   y:0,   z:D-T, w:W, h:H, d:T,
     holes:[[T,oy1,OW,OH],[T,oy2,OW,OH]], front:true, chg:"세로 200 → 225 (구멍 두 개가 안 들어갔음)"});

  [[oy1+2,"아래 서랍",0],[oy2+2,"위 서랍",1]].forEach(function(s){
    var by=s[0], G=s[1], k=s[2], bx=17, bz=D-dd;
    p({id:7, g:G, n:"서랍 앞판",   cut:"266 × 86", q:k?0:2, x:bx, y:by, z:D-T, w:dw, h:dh, d:T, sub:G, knob:!k});
    p({id:8, g:G, n:"서랍 바닥판", cut:"266 × 80", q:k?0:2, x:bx, y:by, z:bz, w:dw, h:T, d:dd-T});
    p({id:9, g:G, n:"서랍 옆판",   cut:"80 × 71",  q:k?0:4, x:bx,      y:by+T, z:bz, w:T, h:dh-T, d:dd-T});
    p({id:9, g:G, n:"서랍 옆판",   cut:"80 × 71",  q:0,     x:bx+dw-T, y:by+T, z:bz, w:T, h:dh-T, d:dd-T});
    p({id:10,g:G, n:"서랍 뒷판",   cut:"236 × 71", q:k?0:2, x:bx+T, y:by+T, z:bz, w:dw-2*T, h:dh-T, d:T});
    if(!k) p({id:0, g:G, n:"손잡이", cut:"60 × 16", q:2, x:bx+103, y:by+30, z:D, w:60, h:16, d:12, sub:"별도 · 나무 막대"});
  });

  return { key:"A", title:"서랍 2칸 수납장", parts:P, W:W, H:H, D:D,
    dims:[["가로",W],["높이",H],["깊이",D]],
    groups:{ "프레임":[0,0,0,0], "아래 서랍":[0,0,1,165], "위 서랍":[0,0,1,165] },
    fixes:[
      ["고침","<b>앞판 세로 200 → 225.</b> 200으로는 구멍(90) 두 개에 여백 15씩을 더하면 가운데가 <span class='num'>-10mm</span>가 되어 물리적으로 안 들어갑니다."],
      ["고침","<b>뒷판 세로 200 → 225.</b> 앞판과 같이 맞췄습니다."],
      ["고침","<b>옆판 높이 200 → 195.</b> 5mm만 줄이면 <span class='num'>15+90+15+90+15=225</span>로 모든 칸이 딱 떨어집니다."],
      ["고침","<b>중간판 깊이 70 → 100.</b> 다른 판은 전부 100인데 혼자 70이었습니다."],

/* =================== 모양 만들기 =================== */
function rrect(w,h,r,ox,oy){
  ox=ox||0; oy=oy||0;
  r=Math.max(0.1,Math.min(r,w/2,h/2));
  var s=new THREE.Shape();
  s.moveTo(ox+r,oy);
  s.lineTo(ox+w-r,oy);   s.quadraticCurveTo(ox+w,oy,ox+w,oy+r);
  s.lineTo(ox+w,oy+h-r); s.quadraticCurveTo(ox+w,oy+h,ox+w-r,oy+h);
  s.lineTo(ox+r,oy+h);   s.quadraticCurveTo(ox,oy+h,ox,oy+h-r);
  s.lineTo(ox,oy+r);     s.quadraticCurveTo(ox,oy,ox+r,oy);
  return s;
}
function ext(shape,t,seg){
  return new THREE.ExtrudeGeometry(shape,{
    depth:Math.max(0.2,t-2*BEV), bevelEnabled:true, bevelThickness:BEV,
    bevelSize:BEV, bevelOffset:0, bevelSegments:2, curveSegments:seg||12});
}
/* 얇은 축을 찾아 눕힌다. 0..w, 0..h, 0..d 를 정확히 채운다 */
function panelGeom(w,h,d,r){
  r=(r==null?3:r); var g;
  if(d<=w && d<=h){
    g=ext(rrect(w-2*BEV,h-2*BEV,r,BEV,BEV),d); g.translate(0,0,BEV);
  }else if(w<=h){
    g=ext(rrect(d-2*BEV,h-2*BEV,r,BEV,BEV),w); g.translate(0,0,BEV);
    g.rotateY(-Math.PI/2); g.translate(w,0,0);
  }else{
    g=ext(rrect(w-2*BEV,d-2*BEV,r,BEV,BEV),h); g.translate(0,0,BEV);
    g.rotateX(-Math.PI/2); g.translate(0,0,d);
  }
  return g;
}

/* 곡선 실루엣. 전부 정면(z축 두께)을 본다.
   비율(0~1)로 적어두고 실제 치수에 맞춰 늘린다 — 손그림을 그대로 옮긴 것 */
function shapeOf(pts, w, h){
  var s=new THREE.Shape(), X=function(u){return u*w}, Y=function(v){return v*h};
  s.moveTo(X(pts[0][0]),Y(pts[0][1]));
  for(var i=1;i<pts.length;i++){
    var p=pts[i];
    if(p.length===2) s.lineTo(X(p[0]),Y(p[1]));
    else s.quadraticCurveTo(X(p[0]),Y(p[1]),X(p[2]),Y(p[3]));
  }
  return s;
}
var PT = {
  /* 앞(왼쪽)이 뚱뚱한 몸통 + 목 + 머리. 오른쪽 변은 상자에 닿는 직선 */

var SILH = {
  head:  function(w,h){ return shapeOf(PT.head,w,h); },
  comb:  function(w,h){ return shapeOf(PT.comb,w,h); },
  beak:  function(w,h){ return shapeOf(PT.beak,w,h); },
  wattle:function(w,h){ return shapeOf(PT.wattle,w,h); },
  tail:  function(w,h){ return shapeOf(PT.tail,w,h); },
  eye:   function(w,h){
    var s=new THREE.Shape();
    s.absellipse(w/2,h/2,w/2,h/2,0,Math.PI*2,false,0);
    return s;
  }
};

function geomFor(p){
  var g;
  if(p.cyl){                                // 펜
    g=new THREE.CylinderGeometry(p.cyl[0],p.cyl[0]*0.92,p.cyl[1],16);
    g.translate(0,p.cyl[1]/2,0); return g;
  }
  if(p.silh){
    g=ext(SILH[p.silh](p.w,p.h), p.d, 24); g.translate(0,0,BEV); return g;
  }
  if(p.curve){        // 윗변이 한쪽으로 올라가는 함 옆판. 얇은 축을 찾아 눕힌다
    var h0=p.curve[0], h1=p.curve[1];
    var sideways = p.w <= p.d;              // true면 판이 좌우를 본다(두께가 x)
    var L = sideways ? p.d : p.w, t = sideways ? p.w : p.d;
    var top=Math.max(h0,h1);
    var s=new THREE.Shape();
    s.moveTo(2,0); s.lineTo(L-2,0);
    s.quadraticCurveTo(L,0,L,h1-2);
    s.quadraticCurveTo(L*0.52, top*1.05, 0, h0);
    s.quadraticCurveTo(0,0,2,0);
    g=ext(s,t,20); g.translate(0,0,BEV);
    if(sideways){ g.rotateY(-Math.PI/2); g.translate(t,0,0); }
    return g;
  }
  if(p.holes || p.ellipse){
    var a=p.w, b=p.holes?p.h:p.d;
    var sp=rrect(a-2*BEV,b-2*BEV,4,BEV,BEV);
    if(p.holes) p.holes.forEach(function(hh){
      var hp=new THREE.Path();
      var x0=hh[0]+BEV, y0=hh[1]+BEV, hw=hh[2]-2*BEV, hh2=hh[3]-2*BEV, r=6;
      hp.moveTo(x0+r,y0);
      hp.lineTo(x0+hw-r,y0);      hp.quadraticCurveTo(x0+hw,y0,x0+hw,y0+r);
      hp.lineTo(x0+hw,y0+hh2-r);  hp.quadraticCurveTo(x0+hw,y0+hh2,x0+hw-r,y0+hh2);
      hp.lineTo(x0+r,y0+hh2);     hp.quadraticCurveTo(x0,y0+hh2,x0,y0+hh2-r);
      hp.lineTo(x0,y0+r);         hp.quadraticCurveTo(x0,y0,x0+r,y0);
      sp.holes.push(hp);
    });
    if(p.ellipse){
      var e=p.ellipse, ep=new THREE.Path();
      ep.absellipse(e[0],e[1],e[2]/2-BEV,e[3]/2-BEV,0,Math.PI*2,false,0);
      sp.holes.push(ep);
    }
    g=ext(sp,p.holes?p.d:p.h,20); g.translate(0,0,BEV);
    if(p.ellipse){ g.rotateX(-Math.PI/2); g.translate(0,0,p.d); }
    return g;
  }
  return panelGeom(p.w,p.h,p.d,p.r);
}

  var x0=model.span?model.span[0]:0, x1=model.span?model.span[1]:model.W;
  var top=model.top||model.H;
  var ctr=new THREE.Vector3((x0+x1)/2, top/2, model.D/2);

  model.parts.forEach(function(p,i){
    var base=(p.col!=null)? new THREE.Color(p.col) : woodCol.clone();
    var m=new THREE.Mesh(geomFor(p), new THREE.MeshLambertMaterial({color:base}));
    m.position.set(p.x,p.y,p.z);
    m.updateMatrixWorld(true);
    var box=new THREE.Box3().setFromObject(m);
    var c=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3());
    var ax = sz.x<=sz.y && sz.x<=sz.z ? "x" : (sz.y<=sz.z ? "y" : "z");
    var dir=new THREE.Vector3();
    dir[ax] = (c[ax]-ctr[ax])>=0 ? 1 : -1;
    if(Math.abs(c[ax]-ctr[ax])<1) dir[ax]=(i%2?1:-1);

    var gv=(model.groups&&model.groups[p.g])||[0,0,0,0];
    var gdir=new THREE.Vector3(gv[0],gv[1],gv[2]);
    if(gdir.lengthSq()>0) gdir.normalize();

    m.userData={p:p, home:m.position.clone(), dir:dir, gdir:gdir, gdist:gv[3], base:base};
    if(!p.decor && !p.cyl){
      m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,32), lineMat));
    }
    root.add(m); meshes.push(m);
  });

  dimGroup=new THREE.Group(); root.add(dimGroup);
  addDim([x0,-38,model.D],[x1,-38,model.D], String(Math.round(x1-x0)));
  addDim([x1+40,0,model.D],[x1+40,top,model.D], String(top));
  addDim([x1+40,-38,0],[x1+40,-38,model.D], String(model.D));

  root.position.set(-ctr.x,-ctr.y,-ctr.z);
  fitCamera(); renderTable(); renderSide(); renderGroups();
}

function addDim(a,b,txt){
  var A=new THREE.Vector3(a[0],a[1],a[2]), B=new THREE.Vector3(b[0],b[1],b[2]);
  dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([A,B]),dimMat));
  var n=new THREE.Vector3().subVectors(B,A).normalize(), t=new THREE.Vector3(0,0,1);
  if(Math.abs(n.z)>0.9) t.set(0,1,0);
  var tick=new THREE.Vector3().crossVectors(n,t).normalize().multiplyScalar(9);
  [A,B].forEach(function(P){
    dimGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
      [P.clone().add(tick), P.clone().sub(tick)]), dimMat));
  });
  var el=document.createElement("div"); el.className="lbl"; el.textContent=txt;
  viewer.appendChild(el);
  labels.push({el:el, v:A.clone().lerp(B,.5)});
}

/* ---- 카메라 ---- */
var yaw=-0.72, pitch=0.40, dist=800, pan=new THREE.Vector3();
function fitCamera(){
  var x0=model.span?model.span[0]:0, x1=model.span?model.span[1]:model.W;
  dist=Math.max(x1-x0, model.top||model.H, model.D)*2.25;
  yaw=-0.62; pitch=0.34; pan.set(0,0,0);
}
function updateCam(){
  var t=new THREE.Vector3().add(pan);
  camera.position.set(
    t.x+dist*Math.cos(pitch)*Math.sin(yaw),
    t.y+dist*Math.sin(pitch),
    t.z+dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(t);
}
/* 조작: 마우스와 손가락 둘 다.
   손가락 하나 = 돌리기 / 손가락 둘 = 확대·이동 / 휠 = 확대 / Shift+끌기 = 이동 */
var ptrs=new Map(), gest=null;
function ptList(){ var a=[]; ptrs.forEach(function(v){a.push(v)}); return a; }
function twoFinger(){
  var a=ptList();
  return {d:Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y),
          x:(a[0].x+a[1].x)/2, y:(a[0].y+a[1].y)/2};
}
function panBy(dx,dy){
  var k=dist*0.0016;
  pan.x-=dx*k*Math.cos(yaw); pan.z+=dx*k*Math.sin(yaw); pan.y+=dy*k;
}
function clampDist(d){ return Math.max(120,Math.min(4500,d)); }

cv.addEventListener("pointerdown",function(e){
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  spinning=false;
  if(ptrs.size===1){
    gest={mode:(e.shiftKey||e.button===1)?"pan":"rot", x:e.clientX, y:e.clientY, moved:0};
  }else if(ptrs.size===2){
    var g=twoFinger();
    gest={mode:"pinch", d0:g.d, dist0:dist, x:g.x, y:g.y, moved:99};
  }
});
cv.addEventListener("pointermove",function(e){
  if(!ptrs.has(e.pointerId) || !gest) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(gest.mode==="pinch" && ptrs.size>=2){
    var g=twoFinger();
    if(g.d>4 && gest.d0>4) dist=clampDist(gest.dist0*(gest.d0/g.d));
    panBy(g.x-gest.x, g.y-gest.y);
    gest.x=g.x; gest.y=g.y;
    return;
  }
  if(ptrs.size!==1) return;
  var dx=e.clientX-gest.x, dy=e.clientY-gest.y;
  gest.moved+=Math.abs(dx)+Math.abs(dy);
  if(gest.mode==="pan") panBy(dx,dy);
  else { yaw-=dx*0.008; pitch=Math.max(-1.35,Math.min(1.35,pitch+dy*0.008)); }
  gest.x=e.clientX; gest.y=e.clientY;
});
function endPtr(e){
  var was=gest;
  ptrs.delete(e.pointerId);
  if(ptrs.size===0){
    if(was && was.mode!=="pinch" && was.moved<7) pick(e);   // 짧게 누르면 선택
    gest=null;
  }else if(ptrs.size===1){
    var a=ptList()[0];
    gest={mode:"rot", x:a.x, y:a.y, moved:99};              // 하나 떼면 돌리기로
  }
}
cv.addEventListener("pointerup",endPtr);
cv.addEventListener("pointercancel",endPtr);
cv.addEventListener("wheel",function(e){
  e.preventDefault();
  dist=clampDist(dist*(1+Math.sign(e.deltaY)*0.11));
},{passive:false});
cv.addEventListener("dblclick",function(){ fitDist(); });

function fitDist(){
  var x0=model.span?model.span[0]:0, x1=model.span?model.span[1]:model.W;
  dist=Math.max(x1-x0, model.top||model.H, model.D)*2.25; pan.set(0,0,0);
}
document.getElementById("zin").onclick =function(){ dist=clampDist(dist*0.80); spinning=false; };
document.getElementById("zout").onclick=function(){ dist=clampDist(dist*1.25); spinning=false; };
document.getElementById("zfit").onclick=function(){ fitDist(); spinning=false; };

/* ---- 선택 ---- */
var ray=new THREE.Raycaster(), hotGroup=null;
function paint(){
  meshes.forEach(function(m){
    var u=m.userData, on = hotGroup && u.p.g===hotGroup;
    m.material.color.copy(on?accCol:u.base);
  });
}
function pick(e){
  var r=cv.getBoundingClientRect();
  var v=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(v,camera);
  var hit=ray.intersectObjects(meshes,false);
  select(hit.length?hit[0].object:null);
}
function select(m){
  hotGroup=null; paint();
  var ro=document.getElementById("ro");
  if(!m){
    ro.innerHTML='<div class="nm">부재를 누르면 치수가 나옵니다</div>'+
      '<div class="dm">한 손가락 돌리기 · 두 손가락 확대·이동</div>';
    markRow(null); markChip(null); return;
  }
  m.material.color.copy(accCol);
  var p=m.userData.p;
  ro.innerHTML='<div class="nm">'+p.n+(p.sub?' <span style="font-weight:400;color:var(--ink-2)">'+p.sub+'</span>':'')+'</div>'+
    '<div class="dm">'+(p.cut? p.cut+' × '+T+'T' : '참고용 모형')+'  ·  묶음: '+p.g+'</div>'+
    (p.chg?'<div class="nt">고침 — '+p.chg+'</div>':'');
  markRow(p.id); markChip(p.g);
}
function markRow(id){
  [].forEach.call(document.querySelectorAll("#tb tr"),function(tr){
    tr.classList.toggle("on", id!=null && tr.dataset.id===String(id));
  });
}
function markChip(g){
  [].forEach.call(document.querySelectorAll(".grp"),function(b){
    b.classList.toggle("on", g!=null && b.dataset.g===g);
  });
}

/* ---- 묶음 칩 ---- */
function renderGroups(){
  var host=document.getElementById("grps"); host.innerHTML="";
  var order=Object.keys(model.groups), count={};
  model.parts.forEach(function(p){ count[p.g]=(count[p.g]||0)+1; });
  order.forEach(function(g){
    var b=document.createElement("button");
    b.className="grp"; b.dataset.g=g; b.type="button";
    b.innerHTML='<i></i>'+g+' <b>'+(count[g]||0)+'</b>';
    b.onmouseenter=function(){ hotGroup=g; paint(); };
    b.onmouseleave=function(){ hotGroup=null; paint(); };
    b.onclick=function(){
      var first=null;
      meshes.forEach(function(m){ if(!first && m.userData.p.g===g && m.userData.p.cut) first=m; });
      select(first);
    };
    host.appendChild(b);
  });
}

/* ---- 표 ---- */
function renderTable(){
  var tb=document.getElementById("tb"); tb.innerHTML="";
  var seen={};
  model.parts.forEach(function(p){
    if(!p.q || !p.cut) return;
    if(seen[p.id]) return; seen[p.id]=1;
    var tr=document.createElement("tr"); tr.dataset.id=p.id;
    tr.innerHTML='<td class="n">'+p.id+'</td><td>'+p.n+
      (p.chg?'<span class="chg">고침 — '+p.chg+'</span>':'')+
      (p.sub?'<span class="sub2">'+p.sub+'</span>':'')+
      '</td><td class="n">'+p.cut+' × '+T+'</td><td class="q">'+p.q+'</td>';
    tr.onclick=function(){
      var m=null;
      meshes.forEach(function(x){ if(!m && x.userData.p.id===p.id) m=x; });
      select(m);
    };
    tb.appendChild(tr);
  });
  document.getElementById("cutTitle").textContent="재단 목록 · "+model.title;
  document.getElementById("dims").innerHTML=model.dims.map(function(x){
    return '<div><b>'+x[1]+'</b><span>'+x[0]+' mm</span></div>'; }).join("");
}
function renderSide(){
  document.getElementById("fixes").innerHTML=model.fixes.map(function(f){
    return '<li><span class="tag'+(f[0]==="유지"?" ok":"")+'">'+f[0]+'</span>'+f[1]+'</li>'; }).join("");
  document.getElementById("asks").innerHTML=model.asks;
}

/* ---- 원판 사용률 ---- */
(function(){
  var area=0;
  ["A","B"].forEach(function(k){
    MODELS[k].parts.forEach(function(p){
      if(!p.q || !p.cut) return;
      var m=p.cut.split("×").map(function(s){ return parseFloat(s.replace(/[^0-9.~]/g,"").split("~").pop()); });
      if(m.length>=2 && !isNaN(m[0]) && !isNaN(m[1])) area+=m[0]*m[1]*p.q;
    });
  });
  document.getElementById("usePct").textContent=Math.round(area/(2440*1220)*100)+"%";
})();

/* ---- 컨트롤 ---- */
var exR=document.getElementById("ex"), cutC=document.getElementById("cut"), dimC=document.getElementById("dim");
exR.oninput=applyExplode;
cutC.onchange=function(){ meshes.forEach(function(m){ if(m.userData.p.front) m.visible=!cutC.checked; }); };
dimC.onchange=function(){
  dimGroup.visible=dimC.checked;
  labels.forEach(function(l){ l.el.style.display=dimC.checked?"":"none"; });
};
/* 1단계: 묶음끼리 벌어진다.  2단계: 묶음 안에서 판이 벌어진다 */
function applyExplode(){
  var t=exR.value/100;
  var s1=Math.min(1,t/0.55), s2=Math.max(0,(t-0.55)/0.45);
  meshes.forEach(function(m){
    var u=m.userData;
    m.position.copy(u.home)
      .addScaledVector(u.gdir, s1*u.gdist)
      .addScaledVector(u.dir,  s2*(u.p.decor?0:60));
  });
}
document.getElementById("reset").onclick=function(){
  fitCamera(); exR.value=0; applyExplode(); select(null); spinning=false; };
document.getElementById("spin").onclick=function(){ spinning=!spinning; };

var tabs=[document.getElementById("tab-A"),document.getElementById("tab-B")];
tabs.forEach(function(t,i){
  t.onclick=function(){
    tabs.forEach(function(x,j){ x.setAttribute("aria-selected", j===i?"true":"false"); });
    exR.value=0; cutC.checked=false; select(null);
    build(i?"B":"A");
    dimGroup.visible=dimC.checked;
  };
});

/* ---- 루프 ---- */
function resize(){
  var w=viewer.clientWidth, h=viewer.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
addEventListener("resize",function(){ setTimeout(resize,60); });
var pv=new THREE.Vector3();
function tick(){
  if(spinning) yaw-=0.004;
  updateCam();
  renderer.render(scene,camera);
  var r=viewer.getBoundingClientRect();
  labels.forEach(function(l){
    pv.copy(l.v).add(root.position).project(camera);
    l.el.style.left=((pv.x*0.5+0.5)*r.width)+"px";
    l.el.style.top=((-pv.y*0.5+0.5)*r.height)+"px";
    l.el.style.opacity = pv.z<1 ? "1" : "0";
  });
  requestAnimationFrame(tick);
}

resize(); build("A"); tick();
document.getElementById("stamp").textContent="2026-09-15 작성";

/* ---- 프레임 촬영용. 주소에 ?shot=1 이 붙었을 때만 돈다 ---- */
(function(){
  var q=new URLSearchParams(location.search);
  if(q.get("shot")!=="1") return;
  document.documentElement.dataset.theme=q.get("theme")||"light";
  document.documentElement.style.background="var(--surface)";
  document.body.style.background="var(--surface)";
  document.querySelector(".wrap").style.cssText="max-width:none;padding:0;margin:0";
  [".mast",".tabs",".side",".ctl",".grps","footer",".hint",".readout",".zoom"].forEach(function(sel){
    var el=document.querySelector(sel); if(el) el.style.display="none";
  });
  var v=document.querySelector(".viewer");
  v.style.cssText="position:fixed;inset:0;border:0;border-radius:0;box-shadow:none;"+
                  "aspect-ratio:auto;background:var(--surface)";
  build(q.get("m")||"A");
  exR.value=q.get("ex")||0; applyExplode();
  var showDim=q.get("dim")!=="0";
  dimGroup.visible=showDim;
  labels.forEach(function(l){ l.el.style.display=showDim?"":"none"; });
  yaw=parseFloat(q.get("yaw")||"-0.62");
  pitch=parseFloat(q.get("pitch")||"0.34");
  if(q.get("zoom")) dist*=parseFloat(q.get("zoom"));
  resize();
})();
})();
</script>
